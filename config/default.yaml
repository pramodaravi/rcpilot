# rcpilot default configuration.
#
# DO NOT EDIT THIS FILE for per-host tweaks. Instead:
#   cp config/default.yaml config/local.yaml
#   <edit config/local.yaml>
# `local.yaml` is gitignored and overrides `default.yaml` at runtime.
#
# You can also point at any path explicitly:
#   RCPILOT_CONFIG=/path/to/my-config.yaml rcpilot-control-sender
#
# Any keys you omit fall back to the built-in dataclass defaults — you only
# need to list the keys you want to override.

network:
  # Jetson's IP. Default is the USB-C virtual ethernet address JetPack
  # auto-assigns when the Jetson is plugged into a host's USB-C port. Switch
  # this to the Jetson's Wi-Fi or Ethernet IP for over-the-air bench testing.
  jetson_ip: 192.168.55.1
  # Cockpit's IP. Used as the udpsink target on the Jetson side. The Jetson
  # offers 192.168.55.100 to the host over USB-C virtual ethernet by default.
  cockpit_ip: 192.168.55.100
  control_port: 5005
  video_port: 5004

control:
  # Send rate from cockpit to car. 250 Hz is the racing-arcade standard;
  # drop to 125 Hz if your laptop's `time.sleep` granularity can't keep up
  # (rare on modern Windows + Python 3.11+).
  rate_hz: 250
  # Car must brake if it goes silent for this many ms.
  watchdog_ms: 200
  joystick_index: 0
  axes:
    # Defaults are correct for an Xbox One controller under SDL2/pygame on
    # Windows. For the Asetek Forte Tony Kanaan wheelbase, run
    # `rcpilot-identify-joystick` first to see your actual axis layout.
    steering: 0
    throttle: 5
    brake: 4
    clutch: 1
    throttle_inverted: false
    brake_inverted: false
    clutch_inverted: false

video:
  # Capture + encode at 720p60 with the IMX219 in sensor_mode=4.
  # Bumping width/height also requires changing sensor_mode (see
  # start_video.sh for the IMX219 mode table).
  width: 1280
  height: 720
  framerate: 60
  bitrate_kbps: 8000
  sensor_mode: 4
  # Software encode while waiting for the Orin NX module. After the NX swap,
  # change to `nvv4l2h264enc` to use hardware NVENC and drop ~40 ms of
  # encode latency. start_video.sh reads this value as $RCPILOT_ENCODER.
  encoder: x264enc
