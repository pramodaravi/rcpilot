[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcpilot"
version = "0.2.0"
description = "RC kart racing arcade — control + video + telemetry stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Full Throttle Karting RC Pilot Project" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "PyYAML>=6.0",
    # Python 3.10 doesn't ship tomllib; use tomli as a fallback for config-file
    # compatibility if anyone hand-edits a TOML config.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
cockpit = [
    # pygame-ce is preferred over upstream pygame on Windows + recent Python,
    # because pygame-ce ships wheels for newer Python versions much faster.
    # `import pygame` works for both.
    "pygame-ce>=2.5",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.1",
    "ruff>=0.5",
]

[project.scripts]
rcpilot-echo-server = "rcpilot.jetson.echo_server:main"
rcpilot-control-sender = "rcpilot.cockpit.control_sender:main"
rcpilot-identify-joystick = "rcpilot.cockpit.joystick:identify_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
